<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ولايات نيوز - منصة إخبارية عمانية</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script>
        const { useState } = React;
        const e = React.createElement;

        // البيانات
        const wilayatData = {
            wilayat: [
                { id: 1, name: "مسقط", englishName: "Muscat", description: "العاصمة العمانية", population: "1.4 مليون", area: "2,730 كم²", coordinates: { latitude: "21.4735°N", longitude: "55.9754°E" } },
                { id: 2, name: "ظفار", englishName: "Dhofar", description: "ولاية جنوبية غنية بالموارد", population: "300,000", area: "99,500 كم²", coordinates: { latitude: "17.0°N", longitude: "54.0°E" } },
                { id: 3, name: "الباطنة", englishName: "Al Batinah", description: "ولاية ساحلية شمالية", population: "800,000", area: "13,812 كم²", coordinates: { latitude: "23.5°N", longitude: "57.0°E" } },
                { id: 4, name: "الشرقية", englishName: "Al Sharqiah", description: "ولاية شرقية تاريخية", population: "500,000", area: "25,000 كم²", coordinates: { latitude: "22.5°N", longitude: "58.5°E" } },
                { id: 5, name: "الوسطى", englishName: "Al Wusta", description: "ولاية وسطى صحراوية", population: "50,000", area: "68,000 كم²", coordinates: { latitude: "20.0°N", longitude: "56.0°E" } },
                { id: 6, name: "الظاهرة", englishName: "Al Dhahira", description: "ولاية داخلية جبلية", population: "250,000", area: "28,500 كم²", coordinates: { latitude: "22.5°N", longitude: "55.5°E" } },
                { id: 7, name: "مسندم", englishName: "Musandam", description: "شبه جزيرة استراتيجية", population: "35,000", area: "1,800 كم²", coordinates: { latitude: "26.2°N", longitude: "56.1°E" } },
                { id: 8, name: "البريمي", englishName: "Al Buraimi", description: "ولاية حدودية", population: "80,000", area: "2,000 كم²", coordinates: { latitude: "24.2°N", longitude: "55.8°E" } },
                { id: 9, name: "محافظة مسقط", englishName: "Muscat Governorate", description: "المحافظة الرئيسية", population: "600,000", area: "3,500 كم²", coordinates: { latitude: "21.5°N", longitude: "55.9°E" } },
                { id: 10, name: "الداخلية", englishName: "Ad Dakhiliyah", description: "ولاية وسطى داخلية", population: "400,000", area: "23,000 كم²", coordinates: { latitude: "21.8°N", longitude: "55.5°E" } }
            ]
        };

        const channelsData = {
            channels: [
                { id: 1, name: "عمّان", englishName: "Oman TV", description: "القناة التلفزيونية الرسمية", type: "تلفاز", language: "عربي", website: "https://www.omantv.gov.om", status: "نشط", category: "أخبار عامة" },
                { id: 2, name: "الإذاعة العمانية", englishName: "Oman Radio", description: "الإذاعة الوطنية", type: "إذاعة", language: "عربي", website: "https://www.omanradio.gov.om", status: "نشط", category: "إخبارية" },
                { id: 3, name: "أخبار عمّان", englishName: "Oman News", description: "بوابة الأخبار الرسمية", type: "ويب", language: "عربي", website: "https://www.omannews.gov.om", status: "نشط", category: "أخبار" },
                { id: 4, name: "العربية", englishName: "Al Arabiya", description: "قناة إخبارية عربية", type: "تلفاز", language: "عربي", website: "https://www.alarabiya.net", status: "نشط", category: "أخبار دولية" },
                { id: 5, name: "الجزيرة", englishName: "Al Jazeera", description: "شبكة إخبارية عربية", type: "تلفاز", language: "عربي", website: "https://www.aljazeera.net", status: "نشط", category: "أخبار دولية" },
                { id: 6, name: "BBC عربي", englishName: "BBC Arabic", description: "خدمة أخبار عالمية", type: "ويب", language: "عربي", website: "https://www.bbc.com/arabic", status: "نشط", category: "أخبار عالمية" },
                { id: 7, name: "CNN عربي", englishName: "CNN Arabic", description: "شبكة أخبار عالمية", type: "تلفاز", language: "عربي", website: "https://arabic.cnn.com", status: "نشط", category: "أخبار عالمية" },
                { id: 8, name: "روتانا", englishName: "Rotana News", description: "قناة إخبارية متخصصة", type: "تلفاز", language: "عربي", website: "https://www.rotana.net", status: "نشط", category: "أخبار ترفيه" },
                { id: 9, name: "الحرة", englishName: "Al Hurra", description: "محطة إخبارية عربية", type: "تلفاز", language: "عربي", website: "https://www.alhurra.com", status: "نشط", category: "أخبار" },
                { id: 10, name: "سكاي نيوز عربي", englishName: "Sky News Arabic", description: "قناة إخبارية متخصصة", type: "تلفاز", language: "عربي", website: "https://www.skynewsarabia.com", status: "نشط", category: "أخبار" }
            ]
        };

        const wilayatChannelsData = {
            wilayatChannels: [
                { wilayatId: 1, wilayatName: "مسقط", channelIds: [1, 2, 3, 4, 5], localChannels: [{ name: "أخبار مسقط", description: "أخبار محلية من العاصمة", type: "محلي" }] },
                { wilayatId: 2, wilayatName: "ظفار", channelIds: [1, 5, 8], localChannels: [{ name: "أخبار ظفار", description: "أخبار محلية من ظفار", type: "محلي" }] },
                { wilayatId: 3, wilayatName: "الباطنة", channelIds: [1, 2, 4, 6], localChannels: [{ name: "أخبار الباطنة", description: "أخبار محلية من الباطنة", type: "محلي" }] },
                { wilayatId: 4, wilayatName: "الشرقية", channelIds: [1, 3, 7, 9], localChannels: [{ name: "أخبار الشرقية", description: "أخبار محلية من الشرقية", type: "محلي" }] },
                { wilayatId: 5, wilayatName: "الوسطى", channelIds: [1, 5], localChannels: [{ name: "أخبار الوسطى", description: "أخبار محلية من الوسطى", type: "محلي" }] },
                { wilayatId: 6, wilayatName: "الظاهرة", channelIds: [1, 2, 4, 8], localChannels: [{ name: "أخبار الظاهرة", description: "أخبار محلية من الظاهرة", type: "محلي" }] },
                { wilayatId: 7, wilayatName: "مسندم", channelIds: [1, 3, 6], localChannels: [{ name: "أخبار مسندم", description: "أخبار محلية من مسندم", type: "محلي" }] },
                { wilayatId: 8, wilayatName: "البريمي", channelIds: [1, 2, 4], localChannels: [{ name: "أخبار البريمي", description: "أخبار محلية من البريمي", type: "محلي" }] },
                { wilayatId: 9, wilayatName: "محافظة مسقط", channelIds: [1, 3, 5, 7, 9], localChannels: [{ name: "أخبار محافظة مسقط", description: "أخبار محلية", type: "محلي" }] },
                { wilayatId: 10, wilayatName: "الداخلية", channelIds: [1, 2, 8, 10], localChannels: [{ name: "أخبار الداخلية", description: "أخبار محلية من الداخلية", type: "محلي" }] }
            ]
        };

        // المكون الرئيسي
        function WilayatNewsHub() {
            const [selectedWilayatId, setSelectedWilayatId] = useState(1);

            const wilayats = wilayatData.wilayat;
            const channels = channelsData.channels;
            const mappings = wilayatChannelsData.wilayatChannels;

            const selectedWilayat = wilayats.find(w => w.id === selectedWilayatId);
            const wilayatMapping = mappings.find(m => m.wilayatId === selectedWilayatId);
            const relatedChannels = wilayatMapping
                ? channels.filter(c => wilayatMapping.channelIds.includes(c.id))
                : [];

            return e('div', { className: 'min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100' },
                // Header
                e('header', { className: 'bg-gradient-to-r from-blue-600 to-indigo-600 text-white shadow-lg' },
                    e('div', { className: 'max-w-7xl mx-auto px-4 py-8' },
                        e('h1', { className: 'text-4xl font-bold' }, '🗞️ ولايات نيوز'),
                        e('p', { className: 'text-blue-100 mt-2' }, 'منصة إخبارية موحدة لأخبار الولايات العُمانية')
                    )
                ),

                // Main Content
                e('div', { className: 'max-w-7xl mx-auto px-4 py-8' },
                    e('div', { className: 'grid grid-cols-1 lg:grid-cols-4 gap-6' },
                        // Sidebar
                        e('div', { className: 'lg:col-span-1' },
                            e('div', { className: 'bg-white rounded-lg shadow-lg p-4 sticky top-4' },
                                e('h2', { className: 'text-xl font-bold text-gray-800 mb-4' }, 'الولايات العُمانية'),
                                e('div', { className: 'space-y-2 max-h-96 overflow-y-auto' },
                                    wilayats.map(wilayat =>
                                        e('button', {
                                            key: wilayat.id,
                                            onClick: () => setSelectedWilayatId(wilayat.id),
                                            className: `w-full text-right px-4 py-2 rounded-lg transition-all ${
                                                selectedWilayatId === wilayat.id
                                                    ? 'bg-blue-600 text-white shadow-md'
                                                    : 'bg-gray-100 text-gray-800 hover:bg-gray-200'
                                            }`
                                        },
                                            e('div', { className: 'font-semibold' }, wilayat.name),
                                            e('div', { className: 'text-xs opacity-75' }, wilayat.englishName)
                                        )
                                    )
                                )
                            )
                        ),

                        // Main Content Area
                        e('div', { className: 'lg:col-span-3' },
                            selectedWilayat && e(React.Fragment, null,
                                // Wilayat Info
                                e('div', { className: 'bg-white rounded-lg shadow-lg p-6 mb-6' },
                                    e('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-6' },
                                        e('div', null,
                                            e('h2', { className: 'text-3xl font-bold text-gray-800 mb-2' }, selectedWilayat.name),
                                            e('p', { className: 'text-xl text-indigo-600 mb-4' }, selectedWilayat.englishName),
                                            e('p', { className: 'text-gray-600 mb-4' }, selectedWilayat.description)
                                        ),
                                        e('div', { className: 'bg-gradient-to-br from-blue-50 to-indigo-50 rounded-lg p-4' },
                                            e('div', { className: 'grid grid-cols-2 gap-4' },
                                                e('div', null,
                                                    e('p', { className: 'text-sm text-gray-600' }, 'السكان'),
                                                    e('p', { className: 'text-lg font-bold text-gray-800' }, selectedWilayat.population)
                                                ),
                                                e('div', null,
                                                    e('p', { className: 'text-sm text-gray-600' }, 'المساحة'),
                                                    e('p', { className: 'text-lg font-bold text-gray-800' }, selectedWilayat.area)
                                                ),
                                                e('div', null,
                                                    e('p', { className: 'text-sm text-gray-600' }, 'الخط العرضي'),
                                                    e('p', { className: 'text-xs font-mono text-gray-800' }, selectedWilayat.coordinates?.latitude)
                                                ),
                                                e('div', null,
                                                    e('p', { className: 'text-sm text-gray-600' }, 'خط الطول'),
                                                    e('p', { className: 'text-xs font-mono text-gray-800' }, selectedWilayat.coordinates?.longitude)
                                                )
                                            )
                                        )
                                    )
                                ),

                                // Channels Section
                                e('div', null,
                                    e('h3', { className: 'text-2xl font-bold text-gray-800 mb-4' },
                                        `📺 القنوات الإخبارية المتاحة (${relatedChannels.length})`
                                    ),
                                    e('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-4' },
                                        relatedChannels.map(channel =>
                                            e('div', {
                                                key: channel.id,
                                                className: 'bg-white rounded-lg shadow-md p-4 hover:shadow-lg transition-shadow'
                                            },
                                                e('div', { className: 'flex items-start justify-between mb-2' },
                                                    e('div', null,
                                                        e('h4', { className: 'font-bold text-gray-800' }, channel.name),
                                                        e('p', { className: 'text-sm text-indigo-600' }, channel.englishName)
                                                    ),
                                                    e('span', { className: 'bg-green-100 text-green-800 text-xs font-semibold px-2 py-1 rounded' }, channel.status)
                                                ),
                                                e('p', { className: 'text-sm text-gray-600 mb-3' }, channel.description),
                                                e('div', { className: 'grid grid-cols-2 gap-2 text-xs text-gray-600 mb-3' },
                                                    e('div', null,
                                                        e('span', { className: 'font-semibold' }, 'النوع: '),
                                                        channel.type
                                                    ),
                                                    e('div', null,
                                                        e('span', { className: 'font-semibold' }, 'اللغة: '),
                                                        channel.language
                                                    ),
                                                    e('div', { className: 'col-span-2' },
                                                        e('span', { className: 'font-semibold' }, 'التصنيف: '),
                                                        channel.category
                                                    )
                                                ),
                                                e('a', {
                                                    href: channel.website,
                                                    target: '_blank',
                                                    rel: 'noopener noreferrer',
                                                    className: 'inline-block bg-blue-600 text-white px-3 py-1 rounded text-sm hover:bg-blue-700 transition'
                                                }, 'زيارة الموقع →')
                                            )
                                        )
                                    ),

                                    // Local Channels
                                    wilayatMapping?.localChannels && wilayatMapping.localChannels.length > 0 && e('div', { className: 'mt-8' },
                                        e('h3', { className: 'text-2xl font-bold text-gray-800 mb-4' }, '📻 القنوات المحلية'),
                                        e('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-4' },
                                            wilayatMapping.localChannels.map((channel, idx) =>
                                                e('div', {
                                                    key: idx,
                                                    className: 'bg-gradient-to-br from-orange-50 to-amber-50 rounded-lg shadow-md p-4'
                                                },
                                                    e('h4', { className: 'font-bold text-gray-800 mb-2' }, channel.name),
                                                    e('p', { className: 'text-sm text-gray-600 mb-2' }, channel.description),
                                                    e('span', { className: 'inline-block bg-orange-100 text-orange-800 text-xs font-semibold px-2 py-1 rounded' }, channel.type)
                                                )
                                            )
                                        )
                                    )
                                )
                            )
                        )
                    )
                ),

                // Footer
                e('footer', { className: 'bg-gray-800 text-white text-center py-4 mt-12' },
                    e('p', null, '© 2024 ولايات نيوز - منصة إخبارية عُمانية موحدة')
                )
            );
        }

        // تحميل التطبيق
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(WilayatNewsHub));
    </script>
</body>
</html>
